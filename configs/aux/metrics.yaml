# Evaluation-metrics runner config.
#
# Used by utils/metrics.py::get_runner_and_sample_for_metrics and evaluate.py.
# Runner: postcvpr (has public add_cloth_obj + 1-arg criterion_pass, no safecheck overhead).
# Criterions: evaluation set — energy terms + aux.collision_metrics (computes both loss and
#   penetration-% needed by print_metrics_vs_sota; uses obstacle.pos only, not target_pos).
# Dataset: placeholder paths — evaluate.py patches data_root / split_path before instantiation.

experiment:
  name: eval-metrics
  initial_ts: 3.333333333333333e-1
  regular_ts: 3.333333333333333e-2

runner:
  postcvpr:
    push_eps: 2e-3
    initial_ts: 3.333333333333333e-1
    regular_ts: 3.333333333333333e-2
    material:
      density_override: 0.20022
      lame_mu_override: 23600.0
      lame_lambda_override: 44400.0
      bending_coeff_override: 3.9625778333333325e-05

dataloaders:
  inference:
    num_workers: 0
    batch_size: 1
    dataset:
      ccraft:
        # Placeholder paths: evaluate.py overwrites these before creating the dataloader.
        data_root: ''
        split_path: null
        betas_file: null
        # ContourCraft-relative paths (prepended with DEFAULTS.aux_data automatically):
        garment_dicts_dir: 'garment_dicts/smpl'
        obstacle_dict_file: 'smpl_aux.pkl'
        sequence_loader: 'hood_pkl'
        wholeseq: True
        noise_scale: 0
        random_betas: False
        n_coarse_levels: 4
        separate_arms: True
        pinned_verts: True

criterions:
  ccraft:
    postcvpr.mataug.stretching_energy:
    postcvpr.inertia:
    postcvpr.gravitational_energy:
      z_axis: 1
    aux.collision_metrics:
      weight: 1.0
      eps: 1e-3
    postcvpr.mataug.bending_energy:
    postcvpr.friction_energy:
      mu: 0.5
      friction_radius: 3e-3

model:
  postcvpr:
    core_model: 'postcvpr'

device: 'cuda:0'
