# ================================================================================================
# Ablation rung 1 -- Coulomb correction only.
#
# The Modular Contact Operator with its FIRST stage alone: a closed-form Coulomb correction of the
# predictor's tentative tangential motion, bounded by mu * lambda_n.
#
# The other three stages are off, and so is the normal completion:
#   normal_exact: 'off'        no Signorini re-projection after the tangential edit
#   tangential_path: chord     the slide is a straight chord, not a path over the body surface
#   wave_enabled: absent       no membrane-wave propagation
#   wave_strain_cap: absent    no strain limiting
#
# Backbone: the frictionless-retrained ContourCraft checkpoint.
#
# The operator runs at INFERENCE on a frozen predictor: nothing here trains, and no gradient
# flows through it. Set the friction coefficient on the command line with
#   runner.ccraft.material.friction_mu_override=<mu>   (equivalently the --mu flag of the
# inference / evaluation entry points); the `mu` key below is only a fallback.
#
# Normal load: lambda_n comes from force balance over gravity and inertia (lambda_n_source:
# force_balance), in Newtons, so it is independent of the cloth's density parametrisation.
# ================================================================================================
experiment:
  name: contourcraft-armBO-v21aTC-core-ev2-chord
  save_checkpoint_every: 2000
  n_epochs: 20000000


runner:
  ccraft:
    warmup_steps: 100
    increase_roll_every: 5000
    roll_max: 20
    push_eps: 2e-3
    initial_ts: 3.333333333333333e-1
    regular_ts: 3.333333333333333e-2
    grad_clip: 1.
    nocollect_after: 2
    no_world_edges_every: 2
    fake_icontour: False
    optimizer:
      lr: 2e-3
      decay_steps: 50_000
      decay_rate: 5e-1
    material:
      lame_mu_min: 15909
      lame_mu_max: 63636
      lame_lambda_min: 3535.414406069427
      lame_lambda_max: 93333.73508005822
      bending_coeff_min: 6.370782056371576e-08
      bending_coeff_max: 0.0013139737991266374
      density_min: 4.34e-2
      density_max: 7e-1
      friction_mu_override: null  # set via CLI: runner.ccraft.material.friction_mu_override=0.6
    safecheck:
      max_riz_size: 30
      n_rest2pos_steps: 10
      max_impulse_norm: 5e-2
      max_ncoll: 2000
      riz_epsilon: 0
    # --- bolt-on operator: force-balance λ_n, gravity+inertia ONLY (no elastic channel) ---
    contact_arm:
      mode: bolt_on             # none | bolt_on | trained  (none => byte-identical baseline)
      bolt_on:
        eps: 3e-3               # CHECKPOINT property: trained-through endpoint trained at collision eps 2e-3, +1mm.
                                # NOT the released model's 4e-3 (contourcraft.pth's number).
        stiffness: 100.0        # IGNORED when lambda_n_source=force_balance (kept for easy revert)
        eps_v: 2e-3             # static-velocity band = IPC's rule 1e-3*l at the MEASURED scene
                                # scale l = 2.01 m. Enters as eps_v*h, so any
                                #   change to regular_ts silently rescales it.
                                #   == the stick/slip measurement threshold
                                #   eps_stick, so the operator and the metrics share one
                                #   symbol with one value.
        mu: 0.5                 # fallback only; runner.ccraft.material.friction_mu_override / --mu wins
        z_axis: 1               # up-axis (Y-up=1)
        log_every: 50
        lambda_n_source: force_balance
        fb_use_gravity: true
        fb_use_inertia: true
        fb_use_elastic: false             # NO elastic channel. Density-invariant, real Newtons.
                                          #   The seven fb_elastic_* mitigation flags are deliberately
                                          #   ABSENT -- they exist only to tame this channel.
        warmup_steps: 0                   # needs no LBS-transient blindfold: the transient
                                          #   reached λ_n through the elastic channel, which is off.
        fb_g: 9.81
        # --- THE ABLATION: the whole geometry-aware component is OFF. -----------------------------
        # No normal completion, no Signorini clamp, no surface march, no per-segment frames. What
        # remains is the plain eps-mollified Coulomb shrink along the straight ambient chord.
        normal_exact: 'off'            # ships 'preserve_clamp' (completion + clamp).
                                       #   QUOTED: bareword `off` is YAML-1.1 False and there is no
                                       #   bool coercion for this key (unlike path_arc_cone).
                                       #   The nine normal_exact_* sub-knobs are dropped with it.
        # --- THE PATH STEP: the surface march is OFF. ----------------------------------------
        tangential_path: chord         # ships 'surface' (geometry-aware march)
        path_arc_cone: 'off'           # forced: no arc exists under chord traversal
        path_normals: single           # forced: 'multi' requires 'surface' (utils/contact.py:1360)
        # path_substeps / path_arc_cap / path_capstan deliberately ABSENT -- unreachable under
        # chord, and an unreachable key is a `fake_icontour`-class dead key.

        # --- THE PROPAGATION STAGE IS ABSENT. ----------------------------------------------------
        # `wave_enabled` and `wave_strain_cap` are DROPPED, not set false: the membrane wave block of the
        # parent is deleted wholesale. Absent is the same execution path as disabled here (the
        # branch at utils/contact.py:2582 is gated on the key's presence-with-truth), and an
        # explicit `wave_enabled: false` would read as a tested setting rather than a missing
        # stage. This is the identical removal the ladder already performs once, between the
        # complete walk arm and its no-propagation rung.
dataloaders:
  inference:
    num_workers: 0
    batch_size: 1
    dataset:
      ccraft:
        data_root: ''
        body_model_root: 'body_models'
        sequence_loader: 'cmu_npz_smpl'
        garment_dicts_dir: 'garment_dicts'
        obstacle_dict_file: 'smpl_aux.pkl'
        split_path: 'datasplits/train_ccraft.csv'
        pinned_verts: True
        random_betas: False
        n_coarse_levels: 4
        separate_arms: True
        wholeseq: True
        noise_scale: 0

criterions:
  ccraft:
    postcvpr.mataug.stretching_energy:
    postcvpr.inertia:
    postcvpr.gravitational_energy:
      z_axis: 1
    postcvpr.collision_penalty:
      weight_start: 5e+3
      weight_max: 5e+5
      eps: 2e-3
      start_rampup_iteration: 50000
      n_rampup_iterations: 100000
    postcvpr.mataug.bending_energy:
    postcvpr.friction_energy:
      mu: 0.5
      friction_radius: 3e-3

model:
  ccraft:
    core_model: 'ccraft'
    architecture: "f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3|f,c3"
    collision_radius: 3e-2
    body_collision_radius: 3e-2
    n_coarse_levels: 4

device: 'cuda:0'
